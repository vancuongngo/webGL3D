<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1117; }
    canvas { display: block; }
    #hint {
      position: fixed; left: 16px; bottom: 16px;
      font: 13px/1.4 system-ui, sans-serif; color: #c9cdd6;
      background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px;
      pointer-events: none;
    }
  </style>
  <!-- Map the bare "three" import to a CDN, so no build step is needed -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hint">Drag to orbit · Scroll to zoom · Click a shape to recolor it</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
